name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ============================================================================
# MATLAB job -- runs on a self-hosted runner (your lab machine).
#
# WHY self-hosted:
#   MATLAB requires a license.  MathWorks' own GitHub Actions
#   (matlab-actions/setup-matlab) work on GitHub-hosted runners but need a
#   separate MathWorks CI/CD license (free only for public repos, paid for
#   private repos).  A self-hosted runner uses the MATLAB already installed
#   and licensed on your machine -- no extra cost, no extra license.
#
# ONE-TIME SETUP (do this once on the lab machine):
#   1. Go to your repo on GitHub -> Settings -> Actions -> Runners
#      -> "New self-hosted runner"
#   2. Follow the instructions to download and configure the runner agent.
#      The agent is a small background process (~30 MB).
#   3. Install it as a service so it survives reboots:
#        Windows:  ./svc.sh install   (or the PowerShell equivalent shown in the UI)
#   4. Tag the runner with the label "matlab" (Settings -> Runners -> edit).
#      The workflow below targets that label.
#
# The runner must be online when a push/PR is opened.  For a research project
# where you push occasionally, this is usually fine.  If the runner is offline
# the job stays "queued" and runs as soon as the machine comes back online.
# ============================================================================

jobs:

  matlab-tests:
    name: MATLAB image-processing tests
    runs-on: [self-hosted, matlab]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run MATLAB tests
        # runtests() chokes on paths containing '__'; use TestSuite.fromFile instead.
        # matlab -batch exits with code 1 if the assert fails, which fails the job.
        run: >
          matlab -batch
          "suite = matlab.unittest.TestSuite.fromFile('image_processing/__tests__/TestShineEqualize.m');
           runner = matlab.unittest.TestRunner.withTextOutput;
           results = runner.run(suite);
           disp(results.table);
           assert(~any([results.Failed]), 'One or more MATLAB tests failed.')"

  # ==========================================================================
  # Python and JS tests run on GitHub-hosted runners -- no license needed.
  # ==========================================================================

  python-tests:
    name: Python SpAM-task tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run pytest
        run: pytest SpAM_Task/__tests__/ -v

  python-analysis-tests:
    name: Python analysis/rdms + analysis/pilot tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only the subset needed by common.py, semantic_km.py, sensory.py,
        # analysis.pilot.parser, and their tests (tqdm is a lightweight,
        # dependency-free progress bar used by both builders); heavy deps
        # (torch, open_clip, nltk) are not required here -- tests that need
        # them (e.g. test_assign_wn_synsets.py) skip gracefully via
        # pytest.importorskip when nltk is absent.
        run: pip install pytest numpy scipy pandas Pillow tqdm

      - name: Run pytest
        run: pytest analysis/rdms/__tests__/ analysis/pilot/__tests__/ -v

  python-simulations-tests:
    name: Python SpAM-simulations tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only the subset needed by SpAM_Simulations and its tests. scikit-learn
        # is required because multi_dimensional_scaling.py imports sklearn.manifold.MDS
        # at module level (before its rpy2 import); without it here, the R/rpy2-dependent
        # MDS tests would self-skip for the wrong reason (missing sklearn instead of
        # missing R). torch/nltk are not needed.
        run: pip install pytest numpy scipy pandas tqdm plotly scikit-learn

      - name: Run pytest
        run: pytest SpAM_Simulations/__tests__/ -v

  js-tests:
    name: JS SpAM-task tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run node tests
        run: node --test SpAM_Task/__tests__/*.test.js
