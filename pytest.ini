[pytest]
pythonpath = .
testpaths =
    SpAM_Task/__tests__
    SpAM_Simulations/__tests__
    analysis/utils/__tests__
    analysis/s1_pre_vs_post_shine/__tests__
    analysis/s0_build_rdms/__tests__
markers =
    slow: expensive (multi-second) checks; run with -m slow
    manual: need local artifacts (built RDMs, real manifest, WordNet corpus); run with -m manual
    legacy: superseded simulation models (task v0.1, v2.3, v2.4, v3); run with -m legacy
addopts = --strict-markers -m "not slow and not manual and not legacy"
