<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Arrangement Task</title>
  <link rel="stylesheet" href="SpAM_Task/jspsych/jspsych.css">
  <style>body { background-color: #808080; margin: 0; }</style>

  <!-- jsPsych 7 core + plugins (local copies in SpAM_Task/jspsych/) -->
  <script src="SpAM_Task/jspsych/jspsych.js"></script>
  <script src="SpAM_Task/jspsych/plugin-preload.js"></script>
  <script src="SpAM_Task/jspsych/plugin-html-button-response.js"></script>
  <script src="SpAM_Task/jspsych/plugin-fullscreen.js"></script>
  <script src="SpAM_Task/jspsych/plugin-free-sort-patched.js"></script>

  <!-- Seedrandom (separate from jsPsych — exposes Math.seedrandom globally) -->
  <script src="SpAM_Task/jspsych/seedrandom.js"></script>

  <!-- Pavlovia integration: only loaded when running on pavlovia.org.
       Pavlovia injects lib/jspsych-7-pavlovia-2022.1.1.js at runtime via a
       server-side symlink at the project root — do NOT commit this file to
       the repo.
       document.write is intentional: inserts the script tag synchronously
       so the plugin is available before task.js runs. -->
  <script>
    if (window.location.hostname.includes('pavlovia.org')) {
      document.write('<script src="lib\/jspsych-7-pavlovia-2022.1.1.js"><\/script>');
    }
  </script>

  <!-- Experiment modules (load order matters: utils → trial_generator → task) -->
  <script src="SpAM_Task/js/utils.js"></script>
  <script src="SpAM_Task/js/trial_generator.js"></script>
  <script src="SpAM_Task/js/task.js"></script>
</head>
<body></body>
</html>
