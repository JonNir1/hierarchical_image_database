<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Arrangement Task</title>
  <link rel="stylesheet" href="SpAM_Task/jspsych/jspsych.css">
  <style>
    body { background-color: #808080; margin: 0; }
    /* jsPsych vertically centers .jspsych-content via `margin: auto` (jspsych.css),
       which decouples visible spacing from display.min_header_height_px/min_footer_height_px
       and can visually clip content on both edges when it overflows. Top-anchor free-sort
       trials specifically (task.js tags them with the spam-freesort css_classes marker) so
       their reserved header/footer budgets directly determine the visible layout: content
       stacks from the top, and any leftover/deficit only ever shows up at the bottom.
       Non-trial screens (consent, instructions, transitions) keep jsPsych's default centering. */
    .jspsych-content.spam-freesort {
      margin: 0 auto;
      padding-top: 40px; /* small breathing room from the very top of the viewport */
    }
  </style>

  <!-- jsPsych 7 core + plugins (local copies in SpAM_Task/jspsych/) -->
  <script src="SpAM_Task/jspsych/jspsych.js"></script>
  <script src="SpAM_Task/jspsych/plugin-preload.js"></script>
  <script src="SpAM_Task/jspsych/plugin-html-button-response.js"></script>
  <script src="SpAM_Task/jspsych/plugin-fullscreen.js"></script>
  <script src="SpAM_Task/jspsych/plugin-free-sort-patched.js"></script>

  <!-- Seedrandom (separate from jsPsych — exposes Math.seedrandom globally) -->
  <script src="SpAM_Task/jspsych/seedrandom.js"></script>

  <!-- Pavlovia integration: only loaded when running on pavlovia.org.
       Pavlovia injects lib/jspsych-7-pavlovia-2022.1.1.js at runtime via a
       server-side symlink at the project root — do NOT commit this file to
       the repo.
       document.write is intentional: inserts the script tag synchronously
       so the plugin is available before task.js runs. -->
  <script>
    if (window.location.hostname.includes('pavlovia.org')) {
      document.write('<script src="lib\/jspsych-7-pavlovia-2022.1.1.js"><\/script>');
    }
  </script>

  <!-- Experiment modules (load order matters: utils → trial_generator → task).
       Cache-busted with a static ?v= query string tied to deployment.version:
       local dev servers (e.g. `python -m http.server`) send no cache-control
       headers, so browsers can silently keep serving a stale cached copy of
       one of these files across edits while the others reload fresh, causing
       spurious "X is not defined" errors between modules that are actually
       in sync on disk. Bump this alongside deployment.version in
       task_config.json whenever these files change. -->
  <script src="SpAM_Task/js/utils.js?v=4.0"></script>
  <script src="SpAM_Task/js/trial_generator.js?v=4.0"></script>
  <script src="SpAM_Task/js/task.js?v=4.0"></script>
</head>
<body></body>
</html>
