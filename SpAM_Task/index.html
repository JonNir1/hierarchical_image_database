<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Arrangement Task</title>
  <link rel="stylesheet" href="lib/jspsych.css">
  <style>body { background-color: #808080; margin: 0; }</style>

  <!-- jsPsych 7 core + plugins (local copies in lib/) -->
  <script src="lib/jspsych.js"></script>
  <script src="lib/plugin-preload.js"></script>
  <script src="lib/plugin-html-button-response.js"></script>
  <script src="lib/plugin-fullscreen.js"></script>
  <script src="lib/plugin-free-sort-patched.js"></script>

  <!-- Seedrandom (separate from jsPsych — exposes Math.seedrandom globally) -->
  <script src="lib/seedrandom.js"></script>

  <!-- Pavlovia integration: only loaded when running on pavlovia.org.
       document.write is intentional here — it inserts the script tag
       synchronously into the parse stream so the plugin is available
       before task.js runs. On localhost the file is not needed and
       the 404 would cause a noisy console error without this guard. -->
  <script>
    if (window.location.hostname.includes('pavlovia.org')) {
      document.write('<script src="lib\/jspsych-7-pavlovia-2022.1.1.js"><\/script>');
    }
  </script>

  <!-- Experiment modules (load order matters: utils → trial_generator → task) -->
  <script src="js/utils.js"></script>
  <script src="js/trial_generator.js"></script>
  <script src="js/task.js"></script>
</head>
<body></body>
</html>
